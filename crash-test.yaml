apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-notification-crash
  namespace: default
  labels:
    app: chaos-test
  annotations:
    # Cette ligne est CRUCIALE pour envoyer l'alerte à Slack
    notifications.argoproj.io/subscribe.on-sync-failed.slack: "k8s-deployment-status"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-test
  template:
    metadata:
      labels:
        app: chaos-test
    spec:
      containers:
      - name: alpine
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        # Le pod survit 30s puis crash. Kubernetes le relancera.
        args:
        - "sleep 30; echo 'Simulating a fatal error...'; exit 1"
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
